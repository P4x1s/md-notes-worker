name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 最小权限：部署流程只需要读代码，不需要写仓库/发 PR
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 首次部署前请确认 wrangler.toml 中的 D1 database_id / KV id 已替换为真实值。
      # schema 使用 IF NOT EXISTS，可安全重复执行。
      - name: Apply D1 schema
        run: npx wrangler d1 execute md-notes-db --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 必须带 --keep-vars，否则 wrangler deploy 会清空 Dashboard 上配置的 secret。
      - name: Deploy Worker
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
