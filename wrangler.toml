name = "md-notes-demo"
main = "src/index.js"
compatibility_date = "2025-04-01"

# 前端静态资源：/、/app.js、/style.css、/vendor/* 由 Worker 一并托管
[assets]
directory = "./public"
binding = "ASSETS"

# 生产资源（账号 CKevens / e427e1f610cf8d3901de877fb3993eb2）
[[d1_databases]]
binding = "DB"
database_name = "md-notes-db"
database_id = "f06cf269-ed99-43ee-99ac-1c3b8135a4e8"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "487efaed395c49dcbdbf612265c4611a"

# 非敏感配置可写在这里；SESSION_SECRET / INVITE_CODE 必须用 secret
[vars]
SESSION_TTL_SECONDS = "604800"
