name = "md-notes-demo"
main = "src/index.js"
compatibility_date = "2025-04-01"

# 前端静态资源：/、/app.js、/style.css、/vendor/* 由 Worker 一并托管
[assets]
directory = "./public"
binding = "ASSETS"

# 本地开发可直接用下面的占位 ID；部署前必须替换为真实 ID
[[d1_databases]]
binding = "DB"
database_name = "md-notes-db"
database_id = "37332cc5-d6c0-4f2f-9fa0-9de97ac28559"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "95d530c2-a678-435a-a7c2-a986560a15e1"

# 非敏感配置可写在这里；SESSION_SECRET / INVITE_CODE 必须用 secret
[vars]
SESSION_TTL_SECONDS = "604800"
